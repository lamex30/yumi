<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#171322">
  <title>Юми · панель</title>
  <link rel="icon" href="/art/icon">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  <div class="scanlines" aria-hidden="true"></div>

  <section id="login" class="login-screen" hidden>
    <div class="login-card pixel-frame">
      <div class="login-art"><img src="/art/icon" alt="" width="96" height="96"></div>
      <div class="login-kicker">YUMI // LOCAL PANEL</div>
      <h1 id="login-title">Юми ждёт <span class="blink">_</span></h1>
      <p id="login-help" class="muted">Вставь ссылку с токеном или сам токен. Он лежит в Yumi:
        <b>Настройки → Веб-панель → Скопировать ссылку</b>.</p>
      <form id="login-form" autocomplete="off">
        <label class="field">
          <span id="login-label">Токен или ссылка</span>
          <input id="login-token" type="password" spellcheck="false" autocomplete="current-password"
                 placeholder="http://127.0.0.1:8765/?t=…">
        </label>
        <button id="login-submit" class="btn btn-primary btn-wide" type="submit">Открыть панель</button>
      </form>
      <div id="login-error" class="error" role="alert"></div>
      <div id="login-foot" class="login-foot muted">Панель по умолчанию слушает только 127.0.0.1 · сессия HttpOnly</div>
    </div>
  </section>

  <div id="shell" class="shell" hidden>
    <aside class="sidebar">
      <a class="brand" href="#/dashboard" aria-label="На главную">
        <span class="brand-art"><img src="/art/icon" alt="" width="44" height="44"></span>
        <span class="brand-text"><b>ЮМИ</b><small>local panel</small></span>
      </a>
      <nav id="nav" class="nav" aria-label="Страницы"></nav>
      <div class="sidebar-foot">
        <div class="side-state">
          <span id="side-dot" class="dot"></span>
          <span id="side-state">подключаюсь…</span>
        </div>
        <button id="logout" class="btn btn-ghost btn-small">Выйти</button>
      </div>
    </aside>

    <div class="work">
      <header class="topbar">
        <button id="menu-toggle" class="btn btn-icon mobile-only" aria-label="Меню">≡</button>
        <div class="top-title">
          <span id="page-title">Обзор</span>
          <small id="page-hint"></small>
        </div>
        <div class="top-chips">
          <button id="chip-dnd" class="chip" title="Не мешать"><span class="dot"></span><span>DND</span></button>
          <button id="chip-show" class="chip" title="Показать / спрятать"><span id="chip-show-name">ЮМИ</span><span id="chip-show-action">ПОКАЗАТЬ</span></button>
          <button id="chip-timer" class="chip" hidden>00:00</button>
          <button id="chip-pin" class="chip" title="Не прятаться">pin</button>
          <span id="conn" class="conn" title="Соединение">●</span>
        </div>
      </header>

      <main id="view" class="view" tabindex="-1">
        <div class="loading pixel-frame">Юми просыпается…</div>
      </main>
    </div>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="modal" class="modal" hidden><div class="modal-box pixel-frame" id="modal-box"></div></div>

  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
